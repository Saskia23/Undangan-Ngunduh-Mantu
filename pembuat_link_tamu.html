<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pembuat Link Tamu | Saskia & Regi</title>
  <style>
    :root { color-scheme: light; --ink:#3d2210; --gold:#a4791f; --line:#e5d4b2; }
    * { box-sizing:border-box; }
    body { margin:0; padding:32px 16px; background:radial-gradient(circle at 10% 5%,#f1dfbb,transparent 34%),#f8f1e7; color:var(--ink); font:16px/1.55 Georgia,serif; }
    main { max-width:760px; margin:auto; padding:clamp(22px,5vw,42px); border:1px solid #d3b771; border-radius:24px; background:rgba(255,253,249,.95); box-shadow:0 18px 50px #5a371a1a; }
    h1 { margin:0 0 8px; font-size:clamp(26px,6vw,38px); color:#6f471d; }
    .hint { color:#785f45; margin:0 0 24px; }
    label { display:block; margin:18px 0 7px; font-weight:bold; }
    input,textarea { display:block; width:100%; border:1px solid var(--line); border-radius:12px; padding:13px 14px; color:var(--ink); background:#fffdfa; font:inherit; }
    textarea { min-height:220px; resize:vertical; }
    button { margin:14px 8px 0 0; border:0; border-radius:999px; padding:12px 19px; font:700 13px/1.2 Arial,sans-serif; letter-spacing:.04em; cursor:pointer; background:linear-gradient(135deg,#e0b84f,#a4791f); color:#3d2210; }
    button.secondary { background:#f3ead8; border:1px solid var(--line); }
    #status { min-height:24px; color:#6f471d; font-size:14px; }
    #results { display:grid; gap:10px; margin-top:16px; }
    .row { padding:12px; border:1px solid #eadfc9; border-radius:12px; background:#fffdfa; overflow-wrap:anywhere; }
    .row strong { display:block; margin-bottom:4px; }
    .row a { color:#785516; font-size:13px; }
    .privacy { padding:12px 14px; border-left:3px solid #c9982f; background:#faf3e5; border-radius:6px; font-size:13px; }
  </style>
</head>
<body>
<main>
  <h1>Pembuat Link Undangan Tamu</h1>
  <p class="hint">Buat satu tautan personal untuk setiap tamu. Nama otomatis muncul di sampul dan kolom nama RSVP.</p>
  <p class="privacy">Daftar nama diproses di browser ini saja. Tidak dikirim ke server.</p>
  <label for="baseUrl">Alamat undangan yang sudah dipublikasikan</label>
  <input id="baseUrl" type="url" placeholder="https://ngunduh-mantu.pages.dev/" required>
  <label for="guestNames">Nama tamu (satu nama per baris)</label>
  <textarea id="guestNames" placeholder="Bpk. Ahmad dan keluarga&#10;Ibu Rina&#10;Keluarga Bpk. Dedi"></textarea>
  <button id="generate">Buat Link Tamu</button>
  <button id="copyAll" class="secondary" disabled>Salin Semua</button>
  <button id="downloadCsv" class="secondary" disabled>Unduh CSV</button>
  <p id="status" aria-live="polite"></p>
  <div id="results"></div>
</main>
<script>
  let guestLinks = [];
  const baseUrl = document.getElementById('baseUrl');
  const guestNames = document.getElementById('guestNames');
  const results = document.getElementById('results');
  const status = document.getElementById('status');
  const copyAll = document.getElementById('copyAll');
  const downloadCsv = document.getElementById('downloadCsv');
  const csvCell = value => '"' + String(value).replaceAll('"', '""') + '"';

  document.getElementById('generate').addEventListener('click', () => {
    let base;
    try { base = new URL(baseUrl.value.trim()); }
    catch { status.textContent = 'Masukkan alamat undangan yang valid setelah undangan dipublikasikan.'; baseUrl.focus(); return; }
    if (!['http:', 'https:'].includes(base.protocol)) { status.textContent = 'Alamat undangan harus menggunakan HTTP atau HTTPS.'; baseUrl.focus(); return; }
    const names = [...new Set(guestNames.value.split(/\r?\n/).map(name => name.trim()).filter(Boolean))];
    if (!names.length) { status.textContent = 'Masukkan minimal satu nama tamu.'; guestNames.focus(); return; }
    if (names.length > 200) { status.textContent = 'Maksimal 200 nama tamu untuk setiap proses.'; guestNames.focus(); return; }
    guestLinks = names.map(name => {
      const url = new URL(base.href); url.searchParams.set('to', name);
      return { name, url: url.href };
    });
    results.replaceChildren();
    guestLinks.forEach(item => {
      const row = document.createElement('div'); row.className = 'row';
      const title = document.createElement('strong'); title.textContent = item.name;
      const link = document.createElement('a'); link.href = item.url; link.textContent = item.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
      row.append(title, link); results.append(row);
    });
    copyAll.disabled = downloadCsv.disabled = false;
    status.textContent = `${guestLinks.length} link personal berhasil dibuat. Kirim tiap link ke tamu yang namanya sesuai.`;
  });

  copyAll.addEventListener('click', async () => {
    const text = guestLinks.map(item => `${item.name}\t${item.url}`).join('\n');
    try {
      if (!navigator.clipboard) throw new Error('Clipboard API unavailable');
      await navigator.clipboard.writeText(text);
      status.textContent = 'Semua nama dan link berhasil disalin.';
    } catch {
      const field = document.createElement('textarea'); field.value = text; document.body.append(field); field.select();
      const copied = document.execCommand('copy'); field.remove();
      status.textContent = copied ? 'Semua nama dan link berhasil disalin.' : 'Clipboard tidak tersedia. Gunakan tombol Unduh CSV.';
    }
  });

  downloadCsv.addEventListener('click', () => {
    const csv = ['Nama Tamu,Link Undangan', ...guestLinks.map(item => `${csvCell(item.name)},${csvCell(item.url)}`)].join('\r\n');
    const blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8' });
    const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'link-undangan-tamu.csv'; link.click(); URL.revokeObjectURL(link.href);
  });
</script>
</body>
</html>
